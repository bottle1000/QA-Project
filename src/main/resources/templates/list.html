<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Practice · 작은 게시판</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/posts">QA Practice<span>작은 게시판</span></a><nav aria-label="주 메뉴"><a href="/posts">게시글 목록</a><th:block th:if="${current == null}"><a href="/login">로그인</a><a href="/signup">회원가입</a></th:block><th:block th:if="${current != null}"><span id="signed-in-user" th:text="${current.displayName}"></span><form action="/logout" method="post"><button class="secondary" id="logout-button">로그아웃</button></form></th:block></nav></header><main><div id="error-message" role="alert" class="alert" th:if="${error}" th:text="${error}"></div><div id="notice-message" role="status" class="notice" th:if="${notice}" th:text="${notice}"></div><div class="heading"><div><p class="eyebrow">COMMUNITY</p><h1>게시글 목록</h1><p class="muted">생각과 이야기를 남기는 공간입니다.</p></div><a th:if="${current != null}" class="button" id="new-post" href="/posts/new">글 작성</a></div><section class="panel"><p id="empty-message" th:if="${posts.isEmpty()}">게시글이 없습니다.</p><div class="table-wrap" th:unless="${posts.isEmpty()}"><table id="posts-table"><thead><tr><th>ID</th><th>제목</th><th>작성자</th><th>작성 시각</th></tr></thead><tbody><tr th:each="post:${posts}"><td th:text="${post.id}"></td><td><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a></td><td th:text="${post.author}"></td><td class="date" th:text="${post.created}"></td></tr></tbody></table></div></section></main><footer>QA Practice <span class="dot">·</span> <span id="build-version" th:text="${version}">0.1.0</span><span class="footer-right">로컬 실습 게시판</span></footer></body></html>
