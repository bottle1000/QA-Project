<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Practice · 작은 게시판</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/posts">QA Practice<span>작은 게시판</span></a><nav aria-label="주 메뉴"><a href="/posts">게시글 목록</a><th:block th:if="${current == null}"><a href="/login">로그인</a><a href="/signup">회원가입</a></th:block><th:block th:if="${current != null}"><span id="signed-in-user" th:text="${current.displayName}"></span><form action="/logout" method="post"><button class="secondary" id="logout-button">로그아웃</button></form></th:block></nav></header><main><div id="error-message" role="alert" class="alert" th:if="${error}" th:text="${error}"></div><div id="notice-message" role="status" class="notice" th:if="${notice}" th:text="${notice}"></div><section class="panel auth"><p class="eyebrow">WELCOME BACK</p><h1>로그인</h1><p class="muted">계정으로 로그인하고 이야기를 나누세요.</p><form action="/login" method="post" novalidate><label for="username">아이디</label><input id="username" name="username" autocomplete="username" th:value="${username}"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password"><button id="login-button">로그인</button></form><p class="muted">처음 방문하셨나요? <a href="/signup">회원가입</a></p></section></main><footer>QA Practice <span class="dot">·</span> <span id="build-version" th:text="${version}">0.1.0</span><span class="footer-right">로컬 실습 게시판</span></footer></body></html>
