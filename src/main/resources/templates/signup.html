<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Practice · 작은 게시판</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/posts">QA Practice<span>작은 게시판</span></a><nav aria-label="주 메뉴"><a href="/posts">게시글 목록</a><th:block th:if="${current == null}"><a href="/login">로그인</a><a href="/signup">회원가입</a></th:block><th:block th:if="${current != null}"><span id="signed-in-user" th:text="${current.displayName}"></span><form action="/logout" method="post"><button class="secondary" id="logout-button">로그아웃</button></form></th:block></nav></header><main><div id="error-message" role="alert" class="alert" th:if="${error}" th:text="${error}"></div><div id="notice-message" role="status" class="notice" th:if="${notice}" th:text="${notice}"></div><section class="panel auth"><p class="eyebrow">JOIN US</p><h1>회원가입</h1><form action="/signup" method="post" novalidate><label for="username">아이디</label><input id="username" name="username" autocomplete="username" th:value="${username}"><small>영문 소문자·숫자 4~20자</small><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password"><small>영문자와 숫자를 포함한 공백 없는 8~32자</small><label for="confirmation">비밀번호 확인</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password"><label for="displayName">표시 이름</label><input id="displayName" name="displayName" th:value="${displayName}"><small>2~20자</small><button id="signup-button">회원가입</button></form></section></main><footer>QA Practice <span class="dot">·</span> <span id="build-version" th:text="${version}">0.1.0</span><span class="footer-right">로컬 실습 게시판</span></footer></body></html>
