<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Practice · 작은 게시판</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/posts">QA Practice<span>작은 게시판</span></a><nav aria-label="주 메뉴"><a href="/posts">게시글 목록</a><th:block th:if="${current == null}"><a href="/login">로그인</a><a href="/signup">회원가입</a></th:block><th:block th:if="${current != null}"><span id="signed-in-user" th:text="${current.displayName}"></span><form action="/logout" method="post"><button class="secondary" id="logout-button">로그아웃</button></form></th:block></nav></header><main><div id="error-message" role="alert" class="alert" th:if="${error}" th:text="${error}"></div><div id="notice-message" role="status" class="notice" th:if="${notice}" th:text="${notice}"></div><p class="eyebrow">WRITE A STORY</p><h1 th:text="${editing ? '게시글 수정' : '게시글 작성'}"></h1><section class="panel"><form th:action="${editing ? '/posts/' + id + '/edit' : '/posts'}" method="post" novalidate><label for="title">제목</label><input id="title" name="title" th:value="${title}"><small>1~100자</small><label for="body">본문</label><textarea id="body" name="body" rows="10" th:text="${body}"></textarea><small>1~2000자</small><div class="actions"><button id="save-button">저장</button><a class="button secondary" id="cancel-button" th:href="${editing ? '/posts/' + id : '/posts'}">취소</a></div></form></section></main><footer>QA Practice <span class="dot">·</span> <span id="build-version" th:text="${version}">0.1.0</span><span class="footer-right">로컬 실습 게시판</span></footer></body></html>
