<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Practice · 작은 게시판</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/posts">QA Practice<span>작은 게시판</span></a><nav aria-label="주 메뉴"><a href="/posts">게시글 목록</a><th:block th:if="${current == null}"><a href="/login">로그인</a><a href="/signup">회원가입</a></th:block><th:block th:if="${current != null}"><span id="signed-in-user" th:text="${current.displayName}"></span><form action="/logout" method="post"><button class="secondary" id="logout-button">로그아웃</button></form></th:block></nav></header><main><div id="error-message" role="alert" class="alert" th:if="${error}" th:text="${error}"></div><div id="notice-message" role="status" class="notice" th:if="${notice}" th:text="${notice}"></div><a class="back" href="/posts">← 게시글 목록</a><article class="panel"><p class="eyebrow">POST <span id="post-id" th:text="${post.id}"></span></p><h1 id="post-title" th:text="${post.title}"></h1><div class="metadata"><span id="post-author" th:text="${post.author}"></span><span>작성 <time id="created-at" th:text="${post.created}"></time></span><span>수정 <time id="updated-at" th:text="${post.updated}"></time></span></div><div id="post-body" class="body" th:text="${post.body}"></div><div class="actions" th:if="${current != null and current.id == post.authorId}"><a class="button" id="edit-button" th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a><form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" onsubmit="return confirm('게시글을 삭제할까요?')"><button class="danger" id="delete-button">삭제</button></form></div></article></main><footer>QA Practice <span class="dot">·</span> <span id="build-version" th:text="${version}">0.1.0</span><span class="footer-right">로컬 실습 게시판</span></footer></body></html>
